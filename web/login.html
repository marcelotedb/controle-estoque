<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Controle de Estoque</title>
<link rel="stylesheet" href="css/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<header class="topo">
  <h1>Controle de Estoque</h1>
</header>

<main class="conteudo">
  <form id="form-login" class="formulario">
    <div class="campo">
      <label for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="username">
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" type="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="botao">Entrar</button>
  </form>
  <p id="mensagem" class="mensagem" hidden></p>
  <p class="vazio">Sem conta ainda? Peça ao dono para criar uma para você.</p>
</main>

<script type="module">
import { cliente } from './js/supabase.js';
import { destinoRedirecionamento, mensagemErroLogin } from './js/autenticacao.js';

const form = document.getElementById('form-login');
const mensagem = document.getElementById('mensagem');

function mostrarErro(texto) {
  mensagem.hidden = false;
  mensagem.textContent = texto;
}

async function entrar(email, senha) {
  // Hook de teste: a verificação injeta um resultado aqui, sem precisar de um
  // projeto Supabase real.
  if (window.__CHAMAR_LOGIN_TESTE__) {
    return window.__CHAMAR_LOGIN_TESTE__(email, senha);
  }
  if (!cliente) {
    return { erro: { message: 'cliente Supabase não configurado' } };
  }
  const { error } = await cliente.auth.signInWithPassword({ email, password: senha });
  return { erro: error };
}

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  mensagem.hidden = true;
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const { erro } = await entrar(email, senha);
  if (erro) {
    mostrarErro(mensagemErroLogin(erro));
    return;
  }
  window.location.href = destinoRedirecionamento(window.location.search);
});
</script>
</body>
</html>
