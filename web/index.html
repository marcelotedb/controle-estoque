        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>

      </button>
      <h1>Painel</h1>
    </header>

<main class="conteudo">
  <input id="busca" class="busca" type="search" placeholder="Buscar por nome, código ou localização…" autocomplete="off">

  <section id="secao-alertas">
    <h2 class="titulo-secao alerta">Itens em alerta</h2>
    <div class="lista" id="lista-alertas"></div>
  </section>

  <section id="secao-pendentes">
    <h2 class="titulo-secao">Pendências</h2>
    <div class="lista" id="lista-pendentes"></div>
  </section>

  <section id="secao-normais">
    <h2 class="titulo-secao">Demais itens</h2>
    <div class="lista" id="lista-normais"></div>
  </section>

  <p id="mensagem" class="mensagem" hidden></p>
</main>
  </div>
</div>
<script src="js/layout.js"></script>

<script type="module">
import { separarSecoes, filtrarLinhas } from './js/painel.js';
import { cliente } from './js/supabase.js';
import { exigirSessao, sair } from './js/autenticacao.js';

document.getElementById('link-sair').addEventListener('click', (ev) => { ev.preventDefault(); sair(cliente); });

function linhaHTML(l) {
  const local = l.localizacao ? ` · ${l.localizacao}` : '';
  return `
    <div class="linha ${l.em_alerta ? 'linha-alerta' : ''}" data-codigo="${l.codigo}">
      <div class="linha-nome">${l.nome} <span class="codigo">${l.codigo}</span>${local}</div>
      <div class="linha-saldos">
        <span title="Disponível">Disp: ${l.saldo_disponivel}</span>
        <span title="Em uso">Uso: ${l.saldo_em_uso}</span>
        <span title="Pendente">Pend: ${l.saldo_pendente}</span>
        <span title="Mínimo">Mín: ${l.quantidade_minima}</span>
      </div>
    </div>`;
}

function renderizar(linhas) {
  const { alertas, pendentes, normais } = separarSecoes(linhas);
  document.getElementById('lista-alertas').innerHTML = alertas.map(linhaHTML).join('') || '<p class="vazio">Nenhum item em alerta.</p>';
  document.getElementById('lista-pendentes').innerHTML = pendentes.map(linhaHTML).join('') || '<p class="vazio">Nenhuma pendência.</p>';
  document.getElementById('lista-normais').innerHTML = normais.map(linhaHTML).join('');
}

let todasAsLinhas = [];

function aplicarBusca() {
  renderizar(filtrarLinhas(todasAsLinhas, document.getElementById('busca').value));
}

async function carregar() {
  const mensagem = document.getElementById('mensagem');
  // Hook de teste: a verificação da Task 8 injeta dados aqui, sem precisar de um
  // projeto Supabase real (que só existe a partir da Task 12).
  if (window.__FIXTURE_SALDOS__) {
    todasAsLinhas = window.__FIXTURE_SALDOS__;
    aplicarBusca();
    return;
  }
  if ((await exigirSessao(cliente, 'index.html')) === null) {
    return;
  }
  if (!cliente) {
    mensagem.hidden = false;
    mensagem.textContent = 'Painel não configurado: defina a URL e a chave do Supabase em js/supabase.js.';
    return;
  }
  const { data, error } = await cliente.from('saldos_itens').select('*');
  if (error) {
    mensagem.hidden = false;
    mensagem.textContent = 'Não foi possível carregar o painel: ' + error.message;
    return;
  }
  todasAsLinhas = data || [];
  aplicarBusca();
}

document.getElementById('busca').addEventListener('input', aplicarBusca);
carregar();
</script>
</body>
</html>
