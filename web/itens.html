</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="img/logo.png" alt="World Informática">
      <span>World Estoque</span>
    </div>
    <nav class="sidebar-nav">

        Painel

        Retirada
      </a>
      <a href="devolucao.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17"/><path d="M17 17H7V7"/></svg>

      </a>

        Itens e locais
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" id="link-sair" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Sair
      </a>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="app-main">
    <header class="topbar">
      <button id="btn-menu" class="btn-menu" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
      </button>
      <h1>Itens e locais</h1>
    </header>

<main class="conteudo">
  <h2 class="titulo-secao">Cadastrar item</h2>
  <form id="form-item" class="formulario">
    <div class="campo">
      <label for="item-nome">Nome</label>
      <input id="item-nome" type="text" required>
    </div>
    <div class="campo">
      <label for="item-categoria">Categoria</label>
      <select id="item-categoria" required>
        <option value="" disabled selected>Selecione…</option>
        <option value="Peças">Peças</option>
        <option value="Revenda">Revenda</option>
        <option value="Insumos">Insumos</option>
      </select>
    </div>
    <div class="campo">
      <label for="item-localizacao">Localização</label>
      <input id="item-localizacao" type="text" placeholder="Ex.: prateleira 2, gaveta 3">
    </div>
    <div class="campo">
      <label for="item-minimo">Quantidade mínima</label>
      <input id="item-minimo" type="number" min="0" step="1" value="0" required>
    </div>
    <button type="submit" class="botao">Cadastrar item</button>
  </form>

  <div id="item-parecidos" class="dialogo-confirmacao" hidden>
    <p>Já existem itens parecidos:</p>
    <div class="lista" id="item-lista-parecidos"></div>
    <div class="acoes">
      <button id="item-btn-cancelar" type="button" class="botao secundario">Cancelar</button>
      <button id="item-btn-confirmar" type="button" class="botao">Criar mesmo assim</button>
    </div>
  </div>

  <p id="item-resultado" class="destaque-numero" hidden></p>
  <p id="item-mensagem" class="mensagem" hidden></p>

  <h2 class="titulo-secao">Cadastrar local de uso</h2>
  <form id="form-local" class="formulario">
    <div class="campo">
      <label for="local-nome">Nome</label>
      <input id="local-nome" type="text" required>
    </div>
    <div class="campo">
      <label for="local-tipo">Tipo</label>
      <select id="local-tipo" required>
        <option value="" disabled selected>Selecione…</option>
        <option value="compartilhado">Compartilhado (qualquer unidade)</option>
        <option value="exclusivo">Exclusivo de uma unidade</option>
      </select>
    </div>
    <div class="campo" id="campo-unidade" hidden>
      <label for="local-unidade">Unidade</label>
      <select id="local-unidade">
        <option value="" disabled selected>Selecione…</option>
        <option value="XAM">XAM — Xambioá (sede)</option>
        <option value="SAGA">SAGA — São Geraldo do Araguaia</option>
        <option value="ARA">ARA — Araguanã</option>
      </select>
    </div>
    <button type="submit" class="botao">Cadastrar local</button>
  </form>

  <div id="local-parecidos" class="dialogo-confirmacao" hidden>
    <p>Já existem locais parecidos:</p>
    <div class="lista" id="local-lista-parecidos"></div>
    <div class="acoes">
      <button id="local-btn-cancelar" type="button" class="botao secundario">Cancelar</button>
      <button id="local-btn-confirmar" type="button" class="botao">Criar mesmo assim</button>
    </div>
  </div>

  <p id="local-resultado" class="destaque-numero" hidden></p>
  <p id="local-mensagem" class="mensagem" hidden></p>
</main>
  </div>
</div>
<script src="js/layout.js"></script>

<script type="module">
import { chamar as chamarReal, cliente } from './js/supabase.js';
import { localExclusivoSemUnidade } from './js/itens.js';
import { exigirSessao, sair } from './js/autenticacao.js';

document.getElementById('link-sair').addEventListener('click', (ev) => { ev.preventDefault(); sair(cliente); });
// Mesmo padrão das outras páginas: aguarda a checagem de sessão (ela mesma
// redireciona para o login quando não há sessão) antes de deixar a tela de
// cadastro ativa.
if (!window.__CHAMAR_TESTE__) {
  await exigirSessao(cliente, 'itens.html');
}

// Gancho de teste: a verificação da Task 10 injeta respostas aqui, sem precisar
// de um projeto Supabase real (que só existe a partir da Task 12).
const chamar = (...args) => (window.__CHAMAR_TESTE__ ? window.__CHAMAR_TESTE__(...args) : chamarReal(...args));

// --- Item ---
const elFormItem = document.getElementById('form-item');
const elItemNome = document.getElementById('item-nome');
const elItemCategoria = document.getElementById('item-categoria');
const elItemLocalizacao = document.getElementById('item-localizacao');
const elItemMinimo = document.getElementById('item-minimo');
const elItemParecidos = document.getElementById('item-parecidos');
const elItemListaParecidos = document.getElementById('item-lista-parecidos');
const elItemBtnCancelar = document.getElementById('item-btn-cancelar');
const elItemBtnConfirmar = document.getElementById('item-btn-confirmar');
const elItemResultado = document.getElementById('item-resultado');
const elItemMensagem = document.getElementById('item-mensagem');

async function salvarItem() {
  const params = {
    p_nome: elItemNome.value,
    p_categoria: elItemCategoria.value,
    p_localizacao: elItemLocalizacao.value || null,
    p_quantidade_minima: Number(elItemMinimo.value),
  };
  const { dados, erro } = await chamar('registrar_item', params);
  elItemParecidos.hidden = true;
  if (erro) {
    elItemMensagem.hidden = false;
    elItemMensagem.textContent = erro.message;
    return;
  }
  elItemResultado.hidden = false;
  elItemResultado.textContent = `Item cadastrado: ${dados}`;
  elFormItem.reset();
}

elFormItem.addEventListener('submit', async (evento) => {
  evento.preventDefault();
  elItemMensagem.hidden = true;
  elItemResultado.hidden = true;

  const { dados: parecidos, erro } = await chamar('verificar_duplicata_item', { p_nome: elItemNome.value });
  if (erro) {
    elItemMensagem.hidden = false;
    elItemMensagem.textContent = erro.message;
    return;
  }
  if (parecidos && parecidos.length > 0) {
    elItemListaParecidos.innerHTML = parecidos.map((p) => `<p class="linha">${p.codigo} — ${p.nome}</p>`).join('');
    elItemParecidos.hidden = false;
    elItemBtnConfirmar.onclick = salvarItem;
    elItemBtnCancelar.onclick = () => { elItemParecidos.hidden = true; };
    return;
  }
  await salvarItem();
});

// --- Local de uso ---
const elFormLocal = document.getElementById('form-local');
const elLocalNome = document.getElementById('local-nome');
const elLocalTipo = document.getElementById('local-tipo');
const elCampoUnidade = document.getElementById('campo-unidade');
const elLocalUnidade = document.getElementById('local-unidade');
const elLocalParecidos = document.getElementById('local-parecidos');
const elLocalListaParecidos = document.getElementById('local-lista-parecidos');
const elLocalBtnCancelar = document.getElementById('local-btn-cancelar');
const elLocalBtnConfirmar = document.getElementById('local-btn-confirmar');
const elLocalResultado = document.getElementById('local-resultado');
const elLocalMensagem = document.getElementById('local-mensagem');

elLocalTipo.addEventListener('change', () => {
  // A unidade não é "required" nativamente: o bloqueio de local exclusivo sem
  // unidade é feito pelo JavaScript do submit, para mostrar a mensagem certa.
  elCampoUnidade.hidden = elLocalTipo.value !== 'exclusivo';
});

async function salvarLocal() {
  const { dados, erro } = await chamar('registrar_local_uso', {
    p_nome: elLocalNome.value,
    p_tipo: elLocalTipo.value,
    p_unidade_codigo: elLocalTipo.value === 'exclusivo' ? elLocalUnidade.value : null,
  });
  elLocalParecidos.hidden = true;
  if (erro) {
    elLocalMensagem.hidden = false;
    elLocalMensagem.textContent = erro.message;
    return;
  }
  elLocalResultado.hidden = false;
  elLocalResultado.textContent = `Local cadastrado: ${elLocalNome.value}`;
  elFormLocal.reset();
  elCampoUnidade.hidden = true;
}

elFormLocal.addEventListener('submit', async (evento) => {
  evento.preventDefault();
  elLocalMensagem.hidden = true;
  elLocalResultado.hidden = true;

  // Bloqueio no cliente, antes de chamar o banco: local exclusivo sem unidade.
  if (localExclusivoSemUnidade(elLocalTipo.value, elLocalUnidade.value)) {
    elLocalMensagem.hidden = false;
    elLocalMensagem.textContent = 'Selecione a unidade: um local exclusivo precisa de uma unidade.';
    return;
  }

  const { dados: parecidos, erro } = await chamar('verificar_duplicata_local', { p_nome: elLocalNome.value });
  if (erro) {
    elLocalMensagem.hidden = false;
    elLocalMensagem.textContent = erro.message;
    return;
  }
  if (parecidos && parecidos.length > 0) {
    elLocalListaParecidos.innerHTML = parecidos.map((p) => `<p class="linha">${p.nome}</p>`).join('');
    elLocalParecidos.hidden = false;
    elLocalBtnConfirmar.onclick = salvarLocal;
    elLocalBtnCancelar.onclick = () => { elLocalParecidos.hidden = true; };
    return;
  }
  await salvarLocal();
});
</script>
</body>
</html>
